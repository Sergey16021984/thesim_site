services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thesim-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./public/videos:/app/public/videos:ro
