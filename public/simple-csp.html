<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест CSP</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; media-src 'self'; object-src 'none';">
</head>
<body>
    <h1>Тест Content Security Policy</h1>
    <p>Если вы видите эту страницу, CSP работает корректно.</p>
    <script>
        console.log('CSP test: eval function test');
        try {
            eval('console.log("eval работает")');
        } catch (e) {
            console.error('eval заблокирован:', e);
        }
    </script>
</body>
</html>
