# 🌐 Nginx конфигурация для TheSim (Production)
user www-data;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Основной сервер HTTP (редирект на HTTPS)
    server {
        listen 80;
        server_name localhost thesim.site www.thesim.site;

        # Разрешить доступ к acme-challenge для Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/html;
            allow all;
        }

        # Редирект на HTTPS (кроме acme-challenge)
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # Основной сервер HTTPS
    server {
        listen 443 ssl http2;
        server_name localhost thesim.site www.thesim.site;

        # SSL сертификаты Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/thesim.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thesim.site/privkey.pem;

        # SSL настройки безопасности (современные и безопасные)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Дополнительная безопасность SSL (закомментировано если файл не существует)
        # ssl_dhparam /etc/nginx/dhparam.pem;  # Раскомментируйте после генерации: openssl dhparam -out /etc/nginx/dhparam.pem 2048

        # OCSP Stapling для ускорения проверки сертификатов
        ssl_stapling on;
        ssl_stapling_verify on;

        # Строгие заголовки безопасности
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP управляется Next.js приложением

        # Статические файлы - отдаём напрямую, минуя Next.js
        location /videos/ {
            alias /var/www/html/videos/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        location /images/ {
            alias /var/www/html/images/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Все остальные запросы проксируем к Next.js приложению
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
